<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAARVIS Live</title>
  <style>
    /* JAARVIS Space HUD — built on the Mark dashboard visual system
     * (same header pills, feed bubbles, footer composer, mic worklet).
     * Wired to the Space voice bridge (/ws/voice): key stays server-side. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #7fd8ff;
      --adim:    rgba(127,216,255,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    body[data-soul="friday"] { --accent:#7fffd4; --adim:rgba(127,255,212,0.14); }
    body[data-soul="ultron"] { --accent:#ff9a7f; --adim:rgba(255,154,127,0.14); }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted);
    }
    .pill.on { border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .pill.on .dot { background: var(--green); }
    .spacer { flex: 1; }
    #soulsel {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700;
      letter-spacing: 1px;
    }
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; }
    .msg-j   { align-self:flex-start; background:var(--adim); border:1px solid rgba(255,255,255,0.09); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border); border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color: var(--accent); }
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; }
    .btn:active { transform: scale(0.96); }
    .btn-send { background: var(--accent); color: #06121a; }
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px; cursor: pointer;
    }
    #img-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px; cursor: pointer;
    }
    #img-btn:active, #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px; opacity:0; transition:opacity 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body data-soul="jarvis">
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>AARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="spacer"></div>
    <select id="soulsel" aria-label="Soul">
      <option value="jarvis">JARVIS</option>
      <option value="friday">FRIDAY</option>
      <option value="ultron">ULTRON</option>
    </select>
  </header>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to JAARVIS…" autocomplete="off">
    <input type="file" id="img-inp" accept="image/*" style="display:none">
    <button id="img-btn" title="Show him what you see">👁</button>
    <button id="mic-btn" title="Voice — tap to speak">🎤</button>
    <button class="btn btn-send" id="send">SEND</button>
  </footer>
  <script>
    var soul = "jarvis";
    var NAMES = { jarvis: "JARVIS", friday: "FRIDAY", ultron: "ULTRON" };
    var feed = document.getElementById("feed");
    var pill = document.getElementById("pill");
    var st = document.getElementById("st");
    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function sys(t) {
      var d = document.createElement("div");
      d.className = "msg-sys"; d.textContent = t;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }
    function bubble(who, text) {
      var d = document.createElement("div");
      d.className = who === "u" ? "msg msg-u" : "msg msg-j";
      var l = document.createElement("div");
      l.className = "lbl"; l.textContent = who === "u" ? "you" : NAMES[soul];
      var b = document.createElement("div");
      b.textContent = text;
      d.appendChild(l); d.appendChild(b);
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
      return b;
    }
    function toast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(function () { t.classList.remove("show"); }, 2600);
    }
    function setConn(on, label) {
      pill.classList.toggle("on", !!on);
      st.textContent = label || (on ? "Live" : "Connecting");
    }
    // ── Bridge socket (Space voice bridge protocol) ──
    var ws = null, curBubble = null, curText = "";
    function connect() {
      if (ws) { try { ws.close(); } catch (e) {} }
      setConn(false);
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws/voice");
      ws.onopen = function () {
        ws.send(JSON.stringify({ soul: soul }));
        setConn(true);
        sys(NAMES[soul] + " online — tap mic or type below.");
      };
      ws.onclose = function () { setConn(false, "Reconnecting"); stopMic(false); setTimeout(connect, 2500); };
      ws.onmessage = function (ev) {
        if (typeof ev.data === "string") {
          var m = null;
          try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (m.type === "heard") { bubble("u", m.text); }
          else if (m.type === "said") {
            if (!curBubble) { curText = ""; curBubble = bubble("j", ""); }
            curText += m.text;
            curBubble.textContent = curText;
            feed.scrollTop = feed.scrollHeight;
          }
          else if (m.type === "turn_end") { curBubble = null; }
          else if (m.type === "error") { sys("error: " + m.message); }
        } else {
          ev.data.arrayBuffer().then(function (buf) {
            playQueue.push(new Uint8Array(buf)); pumpAudio();
          });
        }
      };
    }
    // ── Playback (24 kHz PCM from the bridge) ──
    var actx = null, playQueue = [], playing = false;
    function pumpAudio() {
      if (playing || !playQueue.length) return;
      playing = true;
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      var chunk = playQueue.shift();
      var pcm = new Int16Array(chunk.buffer, chunk.byteOffset, Math.floor(chunk.byteLength / 2));
      var buf = actx.createBuffer(1, pcm.length, 24000);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
      var src = actx.createBufferSource();
      src.buffer = buf; src.connect(actx.destination);
      src.onended = function () { playing = false; pumpAudio(); };
      src.start();
    }
    // ── Mic (AudioWorklet PCM16 @16k, buffered to 1024-sample frames) ──
    var micBtn = document.getElementById("mic-btn");
    var micStream = null, micCtx = null, micNode = null, talking = false;
    function f32toPcm16(f32, srcRate) {
      var s = f32;
      if (srcRate !== 16000) {
        var ratio = srcRate / 16000, len = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (var i = 0; i < len; i++) s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      var out = new Int16Array(s.length);
      for (var j = 0; j < s.length; j++) out[j] = Math.max(-32768, Math.min(32767, Math.round(s[j] * 32768)));
      return out.buffer;
    }
    async function startMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        sys("Microphone needs a secure origin (https) — type instead."); return;
      }
      var stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      } catch (e) {
        sys("Microphone denied — allow it in the address bar, or type instead."); return;
      }
      try { micCtx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { micCtx = new AudioContext(); }
      if (micCtx.state === "suspended") { try { await micCtx.resume(); } catch (e) {} }
      var rate = micCtx.sampleRate;
      var src = micCtx.createMediaStreamSource(stream);
      var wCode = "class J extends AudioWorkletProcessor{process(i){var c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);";
      try {
        var burl = URL.createObjectURL(new Blob([wCode], { type: "application/javascript" }));
        await micCtx.audioWorklet.addModule(burl);
        URL.revokeObjectURL(burl);
      } catch (e) {
        sys("Audio engine unavailable here — type instead.");
        stream.getTracks().forEach(function (t) { try { t.stop(); } catch (x) {} });
        return;
      }
      micNode = new AudioWorkletNode(micCtx, "j");
      var pbuf = [], plen = 0;
      micNode.port.onmessage = function (e) {
        // Echo guard: never stream the mic while our own voice is playing.
        // (Desktop does this spectrally; here client-side timing is exact.)
        if (playing) return;
        var chunk = new Int16Array(f32toPcm16(e.data, rate));
        pbuf.push(chunk); plen += chunk.length;
        if (plen >= 1024) {
          var out = new Int16Array(plen), off = 0;
          for (var k = 0; k < pbuf.length; k++) { out.set(pbuf[k], off); off += pbuf[k].length; }
          if (ws && ws.readyState === 1) ws.send(out.buffer);
          pbuf = []; plen = 0;
        }
      };
      src.connect(micNode);
      micStream = stream; talking = true;
      micBtn.classList.add("recording");
      sys("Listening — tap mic to send.");
    }
    function stopMic(announce) {
      talking = false;
      micBtn.classList.remove("recording");
      if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode = null; }
      if (micCtx) { try { micCtx.close(); } catch (e) {} micCtx = null; }
      if (micStream) { micStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); micStream = null; }
      if (announce !== false && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "end" }));
    }
    micBtn.addEventListener("click", function () {
      if (talking) stopMic(true); else startMic();
    });
    // ── Text composer ──
    var inp = document.getElementById("inp");
    function doSend() {
      var v = inp.value.trim();
      if (!v || !ws || ws.readyState !== 1) return;
      bubble("u", v);
      ws.send(JSON.stringify({ type: "text", text: v }));
      inp.value = "";
    }
    document.getElementById("send").addEventListener("click", doSend);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") doSend(); });
    // Server vision: show him a photo/screenshot, he sees it same-turn.
    var imgInp = document.getElementById("img-inp");
    document.getElementById("img-btn").addEventListener("click", function () { imgInp.click(); });
    imgInp.addEventListener("change", function () {
      var f = imgInp.files && imgInp.files[0];
      if (!f || !ws || ws.readyState !== 1) return;
      var rd = new FileReader();
      rd.onload = function () {
        var dataUrl = String(rd.result || "");
        var parts = dataUrl.split(",");
        if (parts.length !== 2) return;
        bubble("u", "📷 showing him this" + (inp.value.trim() ? ": " + inp.value.trim() : "…"));
        ws.send(JSON.stringify({ type: "image",
          mime: f.type || "image/jpeg",
          data: parts[1].slice(0, 8000000),
          text: inp.value.trim() || "Describe what you see, briefly." }));
        inp.value = "";
      };
      rd.readAsDataURL(f);
      imgInp.value = "";
    });
    document.getElementById("soulsel").addEventListener("change", function (e) {
      if (talking) stopMic(false);
      soul = e.target.value;
      document.body.setAttribute("data-soul", soul);
      toast(NAMES[soul] + " taking over");
      connect();
    });
    document.body.setAttribute("data-soul", soul);
    connect();
  </script>
</body>
</html>
